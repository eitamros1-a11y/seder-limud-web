    --accent:#e09a62; --ok:#7fc192; --ok-bg:#1f3125; --warn:#e5b553; --warn-bg:#3a2f15;

html[data-theme=dark] .btn.primary{color:#1b1712}

  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2318; --muted:#7a6d5c; --line:#e4dacb;

*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 8px}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:25px;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.daynav .mid{text-align:center;flex:1}
.daynav .d1{font-weight:700;font-size:17px}
.daynav .d2{font-size:13px;color:var(--muted)}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--tc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px;border-top:4px solid var(--tc,var(--line))}
.t-gemara{--tc:var(--t-gemara)} .t-mishnah{--tc:var(--t-mishnah)} .t-tanakh{--tc:var(--t-tanakh)} .t-kook{--tc:var(--t-kook)} .t-parasha{--tc:var(--t-parasha)} .t-custom{--tc:var(--t-custom)} .t-rambam{--tc:var(--t-rambam)} .t-tehillim{--tc:var(--t-tehillim)} .t-tanya{--tc:var(--t-tanya)}
.rtext{font-family:"Frank Ruhl Libre",serif;font-size:19px;line-height:1.8;margin:0 0 10px}
.rtext.cm{font-size:17px;line-height:1.7}
.rsep{border-top:1px dashed var(--line);margin:8px 0}
.rd-bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rd-bar .btn.on{background:var(--tc);border-color:var(--tc);color:#fff}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tname{font-weight:700;color:var(--tc,var(--muted));font-size:15px}
.label{font-size:13px;color:var(--muted)}
.big{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:25px;line-height:1.3;margin:6px 0 2px}
.big small{font-size:16px;font-weight:500;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;
  padding:8px 13px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:#fff}
@media (prefers-color-scheme: dark){ .btn.primary{color:#1b1712} }
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.small{min-height:34px;padding:4px 10px;font-size:14px}
.btn.ghost{border-style:dashed;color:var(--tc,var(--ink))}
.btn.grow{flex:1 1 130px}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
textarea,select,input[type=date],input[type=number],input[type=password],input[type=text],input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px}
textarea{min-height:70px;resize:vertical}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--tc,var(--ok));border-radius:99px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:160px;text-align:center;padding:12px 2px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
nav a.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:10px;padding:6px 3px;text-align:center;cursor:pointer;background:var(--card);font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:16px;user-select:none}
.cell.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.mhead{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:18px;margin:12px 0 8px;color:var(--tc,var(--accent))}
.field{margin-bottom:12px}
.field>span{display:block;font-weight:600;margin-bottom:5px;font-size:15px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);padding:9px;cursor:pointer;font-weight:600;font-size:15px}
.seg button.on{background:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.note{font-size:14px;color:var(--muted);margin:6px 0}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.sep{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
details.box{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
details.box>summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--tc);list-style-position:inside}
.mtext{font-family:"Frank Ruhl Libre",serif;font-size:19px;line-height:1.75;margin:0 0 12px}
.mtext b{color:var(--tc);font-size:15px;margin-left:6px}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.exp{font-size:16px;line-height:1.7;margin:4px 0 10px}
.exp h4{font-family:"Frank Ruhl Libre",serif;font-size:17px;color:var(--tc);margin:12px 0 4px}
.exp p{margin:4px 0}
.exp ul{margin:4px 0;padding-right:20px}
.exp .src{font-size:12px;color:var(--muted)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .t{font-weight:700;font-size:18px;text-align:center}
.calhead .t small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dots{flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.cal .dots i{width:5px;height:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cal a{min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px 7px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);min-height:62px}
.cal a .n{font-weight:700;font-size:15px;line-height:1.1}
.cal a .h{font-size:11px;color:var(--muted);line-height:1.1}
.cal a.other{opacity:.35}
.cal a.shab{background:var(--off);border-color:transparent}
.cal a.today{outline:2px solid var(--accent);outline-offset:1px}
.cal a.full{background:var(--ok-bg);border-color:var(--ok)}
.cal a.miss{background:var(--warn-bg);border-color:var(--warn)}
.cal a.pre{opacity:.55}
.legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--tc)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow:first-of-type{border-top:0}
.hist{display:grid;grid-template-columns:auto repeat(14,1fr);gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.hist i{height:14px;border-radius:4px;background:var(--line);display:block}
.hist i.on{background:var(--tc)}
.siyum{border:1px solid var(--tc);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.siyum .hd{font-family:"Frank Ruhl Libre",serif;font-size:17px;line-height:1.7}
.hist i.off{background:transparent;border:1px dashed var(--line)}
</style>
</head>

async function runExp(k,gi,t,q){
  const P=trackPortion(k,t), g=groups(k,P.units)[gi]; if(!g||!sampleFn||expBusy[g.xkey]) return;
  if(k==="mishnah" && !MTEXT) await loadMishnah();
  const extraEl=document.querySelector(`[data-kpaste="${g.xkey}"]`), extra=extraEl?extraEl.value.trim():"";
  const out=document.getElementById("x-"+expId(g.xkey)); expBusy[g.xkey]=true;
  if(out) out.innerHTML=(q?md(expGetLocal(g.xkey)||""):"")+`<p class="note">${q?"עונה על השאלה…":"כותב הרחבה…"}</p>`;
  try{
    const ask=typeof q==="string"&&q, prev=ask?(expGetLocal(g.xkey)||""):"", head=ask?(prev?prev+"\n\n":"")+"## שאלה: "+q+"\n":"";
    const r=await sampleFn((IS_APK?"":sysText()+"\n\n")+(ask?askPrompt(k,g,q,extra):expPrompt(k,g,extra)),{modelTier:"default",onText:({text})=>{ if(out) out.innerHTML=md(head+text); }});
    await expSave(g.xkey,head+r.text); delete expBusy[g.xkey]; refresh();
  }catch(e){
    delete expBusy[g.xkey];
    if(out) out.innerHTML=`<p class="note">${e&&e.code==="not_granted"?"לא ניתנה הרשאה ליצירת הרחבות.":e&&e.code==="rate_limited"?"יותר מדי בקשות כרגע – נסה שוב בעוד כמה דקות.":e&&e.code==="api"?"לא הצלחתי ליצור הרחבה: "+esc(e.message):"לא הצלחתי ליצור הרחבה כרגע."}</p>`;
  }
}

let curDate=null; // ISO of day view
function dayView(d){
  curDate=d; const t=parseISO(d), today=todayUTC();
  let h=`<div class="daynav"><button class="navbtn" data-go="${toISO(t-DAY)}" aria-label="יום קודם">›</button>
    <div class="mid"><div class="d1">${esc(fmtDate(t))}${t===today?" · היום":""}</div><div class="d2">${esc(hebDate(t))}</div></div>
    <button class="navbtn" data-go="${toISO(t+DAY)}" aria-label="יום הבא">‹</button></div>`;
  if(t!==today) h+=`<div class="row" style="justify-content:center;margin:-4px 0 12px"><a class="btn small" href="#today">חזרה להיום</a></div>`;
  else h+=updBanner();

    const man=!isShabbat(t)&&!holName(t);
    h+=`<div class="card" style="text-align:center"><div class="big">${isShabbat(t)?"שבת שלום":esc(offLabel(t))}</div><p class="note">${enabled().some(k=>!trackOff(k,t)&&trackPortion(k,t).units.length)?"ביום זה מתוכננים רק: "+esc(enabled().filter(k=>!trackOff(k,t)&&trackPortion(k,t).units.length).map(nameOf).join(", "))+".":"אין לימוד מתוכנן ביום זה. הלוח ממשיך ביום הלימוד הבא מהמקום שבו עצרת."}</p>
      ${man?`<button class="btn small" data-off="${d}">בטל את יום החופש</button>`:""}</div>`;

    return h+journal(d);
  }
  const st=dayStatus(t);
  if(st.due.length && st.done===st.due.length) h+=`<div class="card" style="text-align:center;padding:10px"><b>כל הסדרים של יום זה הושלמו ✓</b></div>`;
  const todays=enabled().filter(k=>!trackOff(k,t));
  if(!todays.length) h+=`<div class="card" style="text-align:center"><p class="note">אין סדר מתוכנן ליום זה לפי ימי הלימוד שבחרת.</p></div>`;
  todays.forEach(k=>{ h+=trackCard(k,t); });

let calMonth=null; // "YYYY-MM"
function calView(){
  const today=todayUTC(); if(!calMonth) calMonth=TODAY().slice(0,7);
  const [Y,M]=calMonth.split("-").map(Number), first=Date.UTC(Y,M-1,1), startT=first-new Date(first).getUTCDay()*DAY;
  const monthName=new Date(first).toLocaleDateString("he-IL",{timeZone:"UTC",month:"long",year:"numeric"});
  const hm1=hebDate(first,{day:undefined,year:undefined}), hm2=hebDate(Date.UTC(Y,M,0),{day:undefined,year:"numeric"});
  let h=`<div class="card"><div class="calhead"><button class="navbtn" data-cal="-1" aria-label="חודש קודם">›</button>
    <div class="t">${esc(monthName)}<small>${esc(hm1===hm2.split(" ")[0]?hm2:hm1+"–"+hm2)}</small></div>
    <button class="navbtn" data-cal="1" aria-label="חודש הבא">‹</button></div><div class="cal">`;
  ["א","ב","ג","ד","ה","ו","ש"].forEach(w=>h+=`<div class="wd">${w}</div>`);
  const en=enabled();
  for(let i=0;i<42;i++){
    const t=startT+i*DAY, d=toISO(t), inM=new Date(t).getUTCMonth()===M-1;
    let cls=inM?"":"other";
    if(t===today) cls+=" today";
    const st=dayStatus(t), off=isOff(t);
    if(off) cls+=" shab";
    if(st.due.length && st.done===st.due.length) cls+=" full";
    else if(t<today && st.due.length) cls+=" miss";
    else if(!st.due.length && !off) cls+=" pre";
    const den=en.filter(k=>!trackOff(k,t) && (!off || trackPortion(k,t).units.length));
    const dots=den.length?`<span class="dots">${den.map(k=>`<i class="t-${tc(k)} ${isDone(k,t)?"on":""}"></i>`).join("")}</span>`:"";
    h+=`<a class="${cls}" href="#day-${d}"><span class="n">${new Date(t).getUTCDate()}</span><span class="h">${isOff(t)?(isShabbat(t)?"שבת":holName(t)?"חג":"חופש"):hebDay(t)}</span>${dots}</a>`;
    if(i>=34 && new Date(t+DAY).getUTCMonth()!==M-1 && new Date(t).getUTCDay()===6) break;
  }
  h+=`</div><div class="legend">${en.map(k=>`<span class="t-${tc(k)}"><i></i>${esc(nameOf(k))}</span>`).join("")}</div>
    <p class="hint">ירוק – יום שהושלם · צהוב – יום שעבר ונשאר בו מה להשלים. לחצו על יום כדי לראות מה ללמוד בו.</p></div>`;
  // backlog
  const miss=[]; for(let t=today-DAY, n=0; n<60; t-=DAY, n++){ const st=dayStatus(t); if(st.due.length && st.done<st.due.length) miss.push([t,st]); }
  if(miss.length){
    h+=`<div class="card"><div class="label">ימים להשלמה</div>`;
    miss.slice(0,15).forEach(([t,st])=>{ h+=`<a class="lrow" href="#day-${toISO(t)}"><span>${esc(fmtDate(t))}</span><span class="note" style="margin:0">${st.due.filter(k=>!isDone(k,t)).map(k=>nameOf(k)).join(", ")}</span></a>`; });
    h+=`<div class="sep"><button class="btn small" data-catch="1">פזר את הפיגור על שבועיים</button>
      <p class="hint">הלוח יחזור לנקודה הראשונה שלא סומנה, ובשנים־עשר ימי הלימוד הבאים המנה היומית תגדל מעט עד שהפער ייסגר. חל על המשנה ועל התנ״ך. גמרא והרב קוק ממילא מחכים לך, ושניים מקרא צמוד לפרשת השבוע.</p></div></div>`;
  }
  // upcoming week
  h+=`<div class="card"><div class="label">השבוע הקרוב</div>`;
  for(let i=0,t=today;i<7;i++,t+=DAY){
    const offP=enabled().filter(k=>!trackOff(k,t)).map(k=>{ const P=trackPortion(k,t); return P.units.length? groups(k,P.units).map(g=>g.label).join(", ") : null; }).filter(Boolean);
    if(isOff(t)){ h+=`<a class="lrow" href="#day-${toISO(t)}"><b>${esc(fmtDate(t,{day:undefined,month:undefined}))}</b><span class="note" style="margin:0;text-align:left">${esc(offLabel(t))}${offP.length?" · "+esc(offP.join(" · ")):" – אין לימוד"}</span></a>`; continue; }
    const parts=enabled().map(k=>{ const P=trackPortion(k,t); return P.units.length? groups(k,P.units).map(g=>g.label).join(", ") : null; }).filter(Boolean);
    h+=`<a class="lrow" href="#day-${toISO(t)}"><b style="white-space:nowrap">${esc(fmtDate(t,{day:undefined,month:undefined}))}</b><span class="note" style="margin:0;text-align:left">${esc(parts.join(" · "))}</span></a>`;
  }
  return h+`</div>`;
}

function planView(){
  const today=todayUTC(), en=enabled(); let h="";
  const days=[]; for(let i=13;i>=0;i--) days.push(today-i*DAY);
  h+=`<div class="card"><div class="label">שבועיים אחרונים</div><div class="hist" style="margin-top:10px">`;
  en.forEach(k=>{ h+=`<span style="padding-left:6px">${esc(nameOf(k))}</span>`+days.map(t=>`<i class="t-${tc(k)} ${trackOff(k,t)?"off":isDone(k,t)?"on":""}"></i>`).join(""); });
  // streak over study days
  let streak=0; for(let t=today, n=0; n<5000; t-=DAY, n++){ const st=dayStatus(t); if(!st.due.length) continue;
    if(st.done===st.due.length) streak++; else if(t===today) continue; else break; }
  const fullDays=Object.keys(S.log).filter(d=>{ const st=dayStatus(parseISO(d)); return st.due.length&&st.done===st.due.length; }).length;
  h+=`</div><div class="stats" style="margin-top:14px"><div><b>${streak}</b><span>ימי לימוד ברצף</span></div><div><b>${fullDays}</b><span>ימים מלאים</span></div><div><b>${Object.keys(S.log).length}</b><span>ימי לימוד</span></div></div></div>`;
  [["mishnah",M_FLAT.length,"משניות",mIndex],["tanakh",T_FLAT.length,"פרקים",tIndex]].forEach(([k,tot,un,idx])=>{
    if(!S.tracks[k].on) return;
    const P=portion(k,startDay(k)), i=P.units.length? idx(P.units[0]) : (P.finished?tot:0);
    const per=(segAt(k,today)||S.tracks[k].segs[0]).per, left=Math.ceil((tot-i)/per), endT=segDaily(k,startDay(k))? startDay(k)+Math.max(0,left-1)*DAY : addDaysFor(k,Math.max(0,left-1));
    const nxt=P.units.length? groups(k,P.units)[0].label : "";
    h+=`<div class="card t-${tc(k)}"><div class="label">${k==="mishnah"?"משנה – כל הש״ס":"תנ״ך"}</div><div class="bar"><i style="width:${(i/tot*100).toFixed(1)}%"></i></div>
      <div class="note">${i} מתוך ${tot} ${un} (${(i/tot*100).toFixed(1)}%)${nxt?" · היום: "+esc(nxt):""}</div>
      <div class="note">סיום משוער: ${esc(fmtDate(endT,{weekday:undefined,year:"numeric"}))} (${esc(hebDate(endT))})</div></div>`;
  });
  if(S.tracks.kook.on){ const P=portion("kook",nextStudy(today)), p=P.units[0];
    h+=`<div class="card t-kook"><div class="label">הרב קוק</div>`;
    KOOK.forEach((bk,b)=>{ h+=`<div class="mhead">${bk[1]}</div><div class="list">`;
      for(let c=bk[2]; c<=bk[3]; c++){ const st=!p||b<p.b||(b===p.b&&c<p.c)?"done":(b===p.b&&c===p.c?"today":""); const L=klen(b,c);
        h+=`<div class="cell ${st}" style="cursor:default" title="${L?L+" פסקאות":""}">${gem(c)}</div>`; }
      h+=`</div>`; });
    h+=`<p class="hint">${p?"היום: "+esc(groups("kook",P.units).map(g=>g.label).join(" · ")):"סיום!"}</p></div>`; }
  (S.custom||[]).filter(c=>c.on).forEach(c=>{ const k="c:"+c.id, P=cPortion(k,nextStudy(today)), i=P.units.length? P.units[0].n-1 : (P.finished?c.total:c.start-1), left=Math.ceil((c.total-i)/c.per);
    h+=`<div class="card t-custom"><div class="label">${esc(c.name)}</div><div class="bar"><i style="width:${(i/c.total*100).toFixed(1)}%"></i></div>
      <div class="note">${i} מתוך ${c.total} (${(i/c.total*100).toFixed(0)}%)${P.units.length?" · הבא: "+esc(groups(k,P.units)[0].label):""}</div>
      <div class="note">${c.wait?"מתקדם לפי מה שסימנת. ":""}בקצב מלא: עוד כ־${left} ימי לימוד</div></div>`; });
  if(S.gemara.on) h+=gemaraGrid();
  // notes
  h+=`<div class="card"><div class="label">ההערות וההרחבות שלי</div>
    <div class="field" style="margin-top:8px"><input type="text" id="q" placeholder="חיפוש בהערות, בהרחבות וביומן"></div>
    <div id="qres">${notesHtml("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn small" data-export="1">ייצוא כל ההערות לקובץ</button></div><div id="xbox"></div></div>`;
  return h;
}
function addStudyDays(t,n){ t=nextStudy(t); let g=0; while(n>0 && g++<20000){ t+=DAY; if(!isOff(t)) n--; } return t; }
function noteTitle(k){
  const [type,rest]=[k.slice(0,k.indexOf(":")),k.slice(k.indexOf(":")+1)], a=rest.split(".").map(Number);
  if(type==="day") return "יומן · "+fmtDate(parseISO(rest));
  if(type==="m") return "משנה · "+MISH[a[0]][1]+" פרק "+gem(a[1]+1);
  if(type==="t") return "תנ״ך · "+TNK[a[0]][1]+" "+gem(a[1]+1);
  if(type==="k") return "הרב קוק · "+KOOK[a[0]][1]+" פרק "+gem(a[1]);
  if(type==="r"){ const nm=LEARN.names[a[0]]; return "רמב״ם · "+(nm?nm[1]:"")+" פרק "+gem(a[1]||0); }
  if(type==="h") return "תהילים · "+gem(a[0]||0)+(a[1]?":"+gem(a[1]):"");
  if(type==="y") return "תניא · "+(LEARN.tl[a[0]]||"");
  if(type==="p") return "שניים מקרא · פרשת "+(PAR[a[0]]?PAR[a[0]][0]:"")+" · "+(ALIYA[parseInt(rest.split(".")[1])]||"");
  if(type==="c" && rest.split(".").length>=3){ const pp=rest.split("."), c=cGet("c:"+pp[0]); if(c&&c.struct){ const nd=c.struct[+pp[1]]||{}; return c.name+(c.struct.length>1&&nd.t?" · "+nd.t:"")+" "+c.cu+" "+num(parseInt(pp[2])||0); } return "ספר שהוסר"; }
  if(type==="c"){ const c=cGet("c:"+rest.split(".")[0]); return (c?c.name+" "+c.unit:"ספר שהוסר · יחידה")+" "+num(+rest.split(".")[1]||0); }
  if(type==="g") return "גמרא · "+MAS[a[0]][1]+" "+gem(a[1]);
  if(/^\d/.test(k)) return "גמרא · "+MAS[a[0]]?.[1]+" "+gem(+k.split(".")[1]); // legacy
  return k;
}
function gemaraGrid(){
  const t=todayUTC(); let h=`<div class="card t-gemara">`;
  if(S.gemara.type==="dafyomi"){
    const cur=dyAt(t).i, curMi=DY_LIST[cur][0];
    h+=`<div class="label">גמרא · דף היומי · ${(cur/DY_LIST.length*100).toFixed(0)}% מהמחזור · לחצו על דף לסימון</div>`;
    [curMi,curMi+1].filter(mi=>mi<MAS.length).forEach(mi=>{ const m=MAS[mi];
      h+=`<div class="mhead">מסכת ${esc(m[1])}</div><div class="list">`;
      for(let d=m[2]; d<=m[3]; d++){ const k=mi+"."+d, gi=DY_LIST.findIndex(x=>x[0]===mi&&x[1]===d);
        h+=`<div class="cell${S.done[k]?" done":""}${gi===cur?" today":""}" data-gtoggle="${k}">${gem(d)}</div>`; }
      h+=`</div>`; });
  } else {
    const units=gUnitsAll(), m=MAS[S.gemara.mas], todayKeys=new Set(gPortion(t).units.map(gKey)), done=units.filter(u=>S.done[gKey(u)]).length;
    h+=`<div class="label">גמרא · מסכת ${esc(m[1])} · ${done}/${units.length}</div><div class="bar"><i style="width:${done/units.length*100}%"></i></div><div class="list" style="margin-top:10px">`;
    units.forEach(u=>{ const k=gKey(u); h+=`<div class="cell${S.done[k]?" done":""}${todayKeys.has(k)?" today":""}" data-gtoggle="${k}">${gem(u.d)}${u.amud?(u.amud==="a"?".":":"):""}</div>`; });
    h+=`</div>`;
  }
  return h+`</div>`;
}

function bindSetup(){
  const today=todayUTC(), fromFor=k=>toISO(startDay(k));
  const range=(a,b,sel,off=0)=>{ let s=""; for(let i=a;i<=b;i++) s+=`<option value="${i-off}" ${i-off==sel?"selected":""}>${gem(i)}</option>`; return s; };

  $("#m-p").onchange=()=>{ const t=+$("#m-t").value; $("#m-m").innerHTML=range(1,MISH[t][2][+$("#m-p").value],0,1); };
  $("#t-b").onchange=()=>{ $("#t-c").innerHTML=range(1,TNK[+$("#t-b").value][2],0,1); };
  $("#k-b").onchange=()=>{ const b=+$("#k-b").value; $("#k-c").innerHTML=range(KOOK[b][2],KOOK[b][3],KOOK[b][2]); };
  document.querySelectorAll("[data-setpos]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.setpos; let pos;
    if(k==="mishnah") pos={t:+$("#m-t").value,p:+$("#m-p").value,m:+$("#m-m").value};
    if(k==="tanakh") pos={b:+$("#t-b").value,c:+$("#t-c").value};
    if(k==="kook") pos={b:+$("#k-b").value,c:+$("#k-c").value,p:+$("#k-p").value};
    const from=fromFor(k); rebase(k,from,{pos}); if(S.extra[k]) for(const x in S.extra[k]) if(x>=from) delete S.extra[k][x]; logSet(k,from,false); save(); toast("הלוח עודכן");
  });
  document.querySelectorAll("#seg-type button").forEach(b=>b.onclick=()=>{ S.gemara.type=b.dataset.type; save(); refresh(); });
  document.querySelectorAll("#seg-pace button").forEach(b=>b.onclick=()=>{ S.gemara.pace=b.dataset.pace; gReset(); save(); refresh(); });
  if($("#mas")) $("#mas").onchange=e=>{ S.gemara.mas=+e.target.value; S.gemara.startDaf=MAS[S.gemara.mas][2]; gReset(); save(); refresh(); };
  if($("#sdaf")) $("#sdaf").onchange=e=>{ S.gemara.startDaf=+e.target.value; gReset(); save(); toast("עודכן"); };
  if($("#start")) $("#start").onchange=e=>{ if(e.target.value){ S.gemara.start=e.target.value; gReset(); save(); } };
  const setUI=o=>{ const c=Object.assign(uiCfg(),o); try{ localStorage.setItem("ui",JSON.stringify(c)); }catch(e){} applyUI(); refresh(); };
  document.querySelectorAll("#seg-theme button").forEach(b=>b.onclick=()=>setUI({theme:b.dataset.th}));
  document.querySelectorAll("#seg-zoom button").forEach(b=>b.onclick=()=>setUI({zoom:+b.dataset.z}));

// =================== ROUTER ===================
function view(){ const v=(location.hash||"#today").slice(1); if(/^day-\d{4}-\d{2}-\d{2}$/.test(v)) return v; return ["today","cal","plan","setup"].includes(v)?v:"today"; }
function typing(){ const a=document.activeElement; return a && ["TEXTAREA","INPUT","SELECT"].includes(a.tagName); }
function refresh(){ render(true); }
function render(keep){ EFF={};
  const v=view(), y=window.scrollY;
  const open=[...document.querySelectorAll("details[data-id]")].filter(x=>x.open).map(x=>x.dataset.id);
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.v===v || (v.startsWith("day-")&&a.dataset.v===(v.slice(4)===TODAY()?"today":"cal"))));
  let h;
  if(v==="today"||v.startsWith("day-")) h=dayView(v==="today"?TODAY():v.slice(4));
  else if(v==="cal") h=calView(); else if(v==="plan") h=planView(); else h=setupView();
  curDate=null;
  $("#view").innerHTML=h;
  if(v==="today"||v.startsWith("day-")) curDate=v==="today"?TODAY():v.slice(4);
  open.forEach(id=>{ const d=document.querySelector(`details[data-id="${id}"]`); if(d) d.open=true; });
  if(v==="setup") bindSetup();
  window.scrollTo(0,keep?y:0);
  if(S.tracks.mishnah.on && MTEXT===null && (v==="today"||v.startsWith("day-"))) loadMishnah().then(()=>{ if(!typing()) refresh(); });
}

// =================== EVENTS ===================
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-cal],[data-gtoggle],[data-tdone],[data-kadj],[data-xrun],[data-xdel],[data-xtra],[data-off],[data-catch],[data-export],[data-xcopy],[data-kehati],[data-xask],[data-sfpick],[data-day],[data-rm],[data-restore],[data-cdelp],[data-goadd],[data-reload],[data-chkupd],[data-rdsel],[data-rmode]"); if(!el) return;
  const ds=el.dataset;
  if(ds.go){ location.hash = ds.go===TODAY()? "today" : "day-"+ds.go; return; }
  if(ds.rdsel!==undefined){ const box=el.closest("[data-rd]"); if(box) loadReader(box,ds.rdsel); return; }
  if(ds.rmode){ S.tracks.rambam.mode=+ds.rmode; save(); toast(ds.rmode==="1"?"פרק אחד ליום":"שלושה פרקים ליום"); refresh(); return; }
  if(ds.reload){ try{ Android.reloadPage(); }catch(e){} return; }
  if(ds.chkupd){ try{ Android.checkUpdates(); toast("בודק…"); }catch(e){ toast("לא זמין"); } return; }
  if(ds.rm){ const nm=nameOf(ds.rm); setTrackOn(ds.rm,false); save(); toast(nm+" הוסר. אפשר להחזיר אותו מרשימת הלימודים."); refresh(); return; }
  if(ds.restore){ setTrackOn(ds.restore,true); save(); toast(nameOf(ds.restore)+" חזר ללוח"); refresh(); return; }
  if(ds.cdelp){ if(!el.dataset.sure){ el.dataset.sure="1"; el.textContent="לחץ שוב למחיקה"; return; }
    S.custom=(S.custom||[]).filter(c=>"c:"+c.id!==ds.cdelp); save(); toast("הספר נמחק. ההערות שכתבת נשמרו."); refresh(); return; }
  if(ds.goadd){ const a=document.getElementById("addbooks"); if(a&&a.scrollIntoView) a.scrollIntoView({block:"start"}); return; }
  if(ds.day){ const [k,i]=ds.day.split("|"), m=curMask(k); m[+i]=m[+i]?0:1;
    if(!m.some(x=>x)){ toast("צריך לפחות יום לימוד אחד בשבוע"); return; }
    setDays(k,m); save(); toast(nameOf(k)+": "+m.reduce((a,b)=>a+(b?1:0),0)+" ימים בשבוע"); refresh(); return; }
  if(ds.sfpick){ sfFind(ds.sfpick,true); return; }
  if(ds.xask){ const [k,gi,d]=ds.xask.split("|"), g=groups(k,trackPortion(k,parseISO(d)).units)[+gi]; if(!g) return;
    const qe=document.querySelector(`[data-q="${g.xkey}"]`), q=qe?qe.value.trim():""; if(!q){ toast("כתבו שאלה"); return; }
    el.disabled=true; runExp(k,+gi,parseISO(d),q); return; }
  if(ds.xcopy){ const [k,gi,d]=ds.xcopy.split("|"), g=groups(k,trackPortion(k,parseISO(d)).units)[+gi]; if(!g) return;
    const pe=document.querySelector(`[data-kpaste="${g.xkey}"]`), txt=sysText()+"\n\n"+expPrompt(k,g,pe?pe.value.trim():"");
    try{ if(window.Android&&Android.copy){ Android.copy(txt); toast("הועתק – הדביקו ב־Gemini או ב־Claude"); return; } }catch(e){}
    try{ navigator.clipboard.writeText(txt).then(()=>toast("הועתק"),()=>toast("ההעתקה נכשלה")); }catch(e){ toast("ההעתקה נכשלה"); } return; }
  if(ds.kehati){ try{ if(!Android.openApp("com.nocker.kehati")) toast("אפליקציית קהתי לא נמצאה – נפתח דף ההתקנה"); }catch(e){ toast("לא הצלחתי לפתוח"); } return; }
  if(ds.off){ S.off=S.off||{}; if(S.off[ds.off]) delete S.off[ds.off]; else { S.off[ds.off]=true; toast("יום חופש – הלוח נדחה ביום אחד"); } save(); refresh(); return; }
  if(ds.catch){ if(catchUp()){ save(); toast("הפיגור פוזר על שבועיים"); } else toast("אין פיגור לפזר"); refresh(); return; }
  if(ds.export){ const txt=exportText(); if(!txt){ toast("אין הערות לייצוא"); return; }
    try{ if(window.Android&&Android.saveFile){ Android.saveFile("seder-limud-notes-"+TODAY()+".txt",txt); return; } }catch(e){}
    $("#xbox").innerHTML=`<p class="note">העתיקו את הטקסט:</p><textarea readonly style="min-height:160px">${esc(txt)}</textarea>`; return; }
  if(ds.cal){ const [Y,M]=calMonth.split("-").map(Number), d=new Date(Date.UTC(Y,M-1+(+ds.cal),1)); calMonth=toISO(d.getTime()).slice(0,7); refresh(); return; }
  if(ds.gtoggle){ const k=ds.gtoggle; if(S.done[k]) delete S.done[k]; else { S.done[k]=Date.now(); toast("יישר כוח!"); }
    const t=curDate?parseISO(curDate):todayUTC(); logSet("gemara",toISO(t),gDone(t)); }
  else if(ds.tdone){ const k=ds.tdone, d=ds.date; const v=!logged(k,d); logSet(k,d,v); if(v) toast("יישר כוח!"); }
  else if(ds.xtra){ const [k,d,dl]=ds.xtra.split("|"); S.extra[k]=S.extra[k]||{}; const v=Math.max(0,(S.extra[k][d]||0)+(+dl)); if(v) S.extra[k][d]=v; else delete S.extra[k][d];
    if(+dl>0) toast("נוסף – הימים הבאים יתקדמו בהתאם"); }
  else if(ds.kadj){ const [b,c,dl]=ds.kadj.split(".").map(Number); let L=klen(b,c);
    if(!L){ const P=portion("kook",parseISO(curDate||TODAY())).units.filter(u=>u.b===b&&u.c===c); L=P.length?P[P.length-1].p:1; if(dl<0) L=Math.max(1,(P.length?P[0].p:1)); }
    else L=Math.max(1,L+dl);
    S.tracks.kook.chLen[b+"."+c]=L; toast(KOOK[b][1]+" פרק "+gem(c)+": "+L+" פסקאות"); }
  else if(ds.xrun){ const [k,gi,d]=ds.xrun.split("|"); el.disabled=true; runExp(k,+gi,parseISO(d)); return; }
  else if(ds.xdel){ expSave(ds.xdel,""); refresh(); return; }
  save(); refresh();
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ $("#qres").innerHTML=notesHtml(e.target.value); return; } const k=e.target.dataset && e.target.dataset.note; if(k===undefined) return; S.notes[k]=e.target.value; save(); });
window.addEventListener("hashchange",()=>render(false));

// =================== BOOT ===================
$("#hdate").textContent=hebDate(todayUTC());
lsLoad(); if(postMigrate()) lsSave(); applyUI(); render(false); setTimeout(nativeSync,800); setTimeout(prefetch,3000);
(async()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    claude.use("sample").then(s=>{ if(s){ sampleFn=s; if(!typing()) refresh(); } }).catch(()=>{});
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    const col=d.collection("data/users/"+id), ref=col.doc("state");
    const snap=await ref.get();
    docRef=ref; expCol=col;
    const data=snap && (typeof snap.data==="function" ? snap.data() : snap);
    if(data && (data.plan||data.gemara)){ S=migrate(data); postMigrate(); lsSave(); }
    if(!data || !data.v || data.v<3) await ref.set(JSON.parse(JSON.stringify(S)));
    if(!typing()) refresh();
  }catch(e){}
})();
</script>
</body>
